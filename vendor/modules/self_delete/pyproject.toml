[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chuck-self-delete"
version = "0.1.0"
description = "Audited Commons G7 self-delete module for Chuck the Buckbot Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pywikibot>=11.2"]

[project.urls]
Repository = "https://github.com/chuckthebuck/chuck-self-delete"

[project.scripts]
self-delete-harness = "self_delete.harness:main"

[tool.setuptools]
packages = ["self_delete"]
include-package-data = true

[tool.setuptools.package-dir]
self_delete = "modules/self_delete"

[tool.setuptools.package-data]
self_delete = [
  "module.toml",
  "static/*.js",
  "static/*.css",
  "frontend/*.css",
  "frontend/*.ts",
  "frontend/*.vue",
  "docs/*.md",
]

[project.entry-points."chuck_buckbot.modules"]
self_delete = "self_delete.manifest:module_manifest"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["modules"]
