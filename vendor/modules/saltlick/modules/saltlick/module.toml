name = "saltlick"
repo = "https://github.com/chuckthebuck/saltlick"
entry_point = "saltlick.service:run_saltlick"
blueprint_entry_point = "saltlick.blueprint:blueprint"
ui = true
redis_namespace = "saltlick"
title = "Salt Shack"
oauth_consumer_mode = "default"
rights = ["manage", "run_jobs", "apply_changes"]

[frontend]
script = "saltlick:static/saltlick-app.js"
styles = ["saltlick:static/style.css"]
props_id = "saltlick-props"
mount_id = "saltlick-app"
docs = "saltlick:docs/saltlick.md"
bundled = false

[[worker_jobs]]
name = "preview"
handler = "saltlick.service:run_saltlick"
concurrency_policy = "allow"
timeout_seconds = 900
enabled = true

[[worker_jobs]]
name = "apply"
handler = "saltlick.service:run_saltlick"
concurrency_policy = "forbid"
required_right = "apply_changes"
timeout_seconds = 1800
enabled = true
