[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chuckbot-saltlick"
version = "0.2.0"
description = "Contract-driven Saltlick scripts for Chuckbot's Salt Shack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1",
  "PyYAML>=6.0.2",
  "pywikibot>=11.2",
]

[project.scripts]
saltlick = "saltlick.cli:main"
saltshack-build = "saltlick.build:main"

[tool.setuptools.packages.find]
where = ["modules"]
include = ["saltlick*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
saltlick = [
  "module.toml",
  "static/*.js",
  "static/*.css",
  "docs/saltlick.md",
  "assets/*.svg",
  "generated/*.yaml",
  "saltlicks/*/*.yaml",
  "saltlicks/*/*.py",
]

[project.entry-points."chuck_buckbot.modules"]
saltlick = "saltlick.manifest:module_manifest"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["modules"]
