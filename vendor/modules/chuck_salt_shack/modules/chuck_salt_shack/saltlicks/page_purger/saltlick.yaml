# A Saltlick contract is both UI metadata and a bounded execution contract.
# It is normalized during discovery and validated again at run boundaries.
# The entrypoint below is trusted image content: public API responses remove it,
# and a browser request can select only this directory's stable Saltlick ID.
contract: 1
display_name: Page purger
description: Preview and perform cache purges through the framework action catalog.
entrypoint: script.py:run

inputs:
  # Wiki inputs become Codex lookups populated from Wikimedia's site matrix.
  wiki:
    type: wiki
    label: Wiki
    required: true
    default:
      code: commons
      family: commons

  # Page values contain namespace/title pairs. The script joins the selected
  # wiki onto each action target so the framework can resolve the right site.
  # The hard item cap and namespace allowlist bound both the UI and API.
  targets:
    type: pages
    label: Page titles
    description: Search and select pages from the chosen wiki and namespace.
    required: true
    max_items: 250
    namespace:
      selectable: true
      allowed: [0, 2, 4, 6, 10, 14]
      default: 0

  force_link_update:
    type: boolean
    label: Force link update
    default: true

  # This can be considerably more expensive on large dependency graphs, so it
  # is an explicit opt-in even though the ordinary link update defaults on.
  recursive_link_update:
    type: boolean
    label: Recursive link update
    default: false

outputs:
  # Outputs describe the plan for people and are validated independently of
  # the executable action envelopes before the run is persisted or rendered.
  planned_count:
    type: number
    label: Planned purges

  targets:
    type: pages
    label: Target pages

actions:
  # This is an allowlist, not a request to execute. Preview renders the emitted
  # envelopes; apply regenerates them and the framework executes only after the
  # reviewed plan digest matches.
  allowed:
    - mediawiki.page.purge
