# This read-only Saltlick demonstrates a typed report with no write actions.
# The installed YAML is the public input/output authority; the entrypoint is
# retained only in the private image registry and never returned to browsers.
contract: 1
display_name: Transclusion report
description: Find pages transcluding a template and return a structured report.
entrypoint: script.py:run

inputs:
  # Start with English Wikipedia; both the template and result namespaces are
  # selectable because templates may be transcluded from local project spaces.
  wiki:
    type: wiki
    label: Wiki
    required: true
    default:
      code: en
      family: wikipedia

  template:
    type: page
    label: Template
    description: The template whose transclusions should be listed.
    required: true
    namespace:
      selectable: true
      default: 10

  # This namespace applies to the result pages, not to the template above.
  # Keeping it as a namespace input makes it follow the same selected wiki.
  namespace:
    type: namespace
    label: Result namespace
    description: Limit the returned pages to this namespace.
    default: 0

  limit:
    type: integer
    label: Maximum pages
    default: 100
    minimum: 1
    maximum: 500

  include_redirects:
    type: boolean
    label: Include redirects
    default: false

outputs:
  # Table columns are a schema as well as rendering hints. Every returned row
  # must contain these fields with these types before it reaches run history.
  count:
    type: number
    label: Matching pages

  matches:
    type: table
    label: Transcluding pages
    columns:
      page:
        type: page
        label: Page
      namespace:
        type: number
        label: Namespace
      redirect:
        type: boolean
        label: Redirect

actions:
  # An empty allowlist is enforced even if the script is later changed to emit
  # an action accidentally: validation rejects the result before dispatch.
  allowed: []
