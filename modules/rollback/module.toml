# Rollback is the built-in framework module.  Its blueprint delegates to the
# established router rather than defining a second worker-job implementation.
name = "rollback"
repo = "https://github.com/chuckthebuck/bucksaltbot2"
entry_point = "modules.rollback.blueprint"
ui = true
buildpacks = ["heroku/python"]
redis_namespace = "rollback"
title = "Rollback"
rights = ["manage", "run_jobs", "edit_config"]
